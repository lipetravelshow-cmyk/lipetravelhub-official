<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#1a241a"/><text x="110" y="76" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="3">LIPE TRAVEL HUB 框架</text><line x1="110" y1="110" x2="470" y2="110" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="110" r="4" fill="#d4c39c"/><text x="110" y="178" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="62" font-weight="600">China-Ready Stack</text><text x="110" y="226" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400">从被发现到被推荐：五个相互连接的环节，把需求转化为可持续的入境价值。</text><path d="M170 520 C300 360 380 360 485 520 S680 680 800 520 S995 360 1115 520 S1325 680 1430 520" fill="none" stroke="#d4c39c" stroke-width="2" opacity=".45"/><circle cx="170" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="170" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="170" cy="520" r="7" fill="#d4c39c"/><text x="170" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">01</text><text x="170" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">可发现性</text><text x="170" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">中国游客能找到巴西吗？</text><circle cx="485" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="485" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="485" cy="520" r="7" fill="#d4c39c"/><text x="485" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">02</text><text x="485" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">可购买性</text><text x="485" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">他们能顺利购买巴西旅游产品吗？</text><circle cx="800" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="800" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="800" cy="520" r="7" fill="#d4c39c"/><text x="800" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">03</text><text x="800" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">可达性</text><text x="800" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">前往巴西是否足够便利？</text><circle cx="1115" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="1115" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="1115" cy="520" r="7" fill="#d4c39c"/><text x="1115" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">04</text><text x="1115" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">接待适配</text><text x="1115" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">抵达后，巴西的体验是否顺畅？</text><circle cx="1430" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="1430" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="1430" cy="520" r="7" fill="#d4c39c"/><text x="1430" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">05</text><text x="1430" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">口碑传播</text><text x="1430" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">他们会把巴西带回中国吗？</text><line x1="110" y1="860" x2="1490" y2="860" stroke="#5f695d"/><text x="110" y="910" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" letter-spacing="1.7">核心原则</text><text x="300" y="910" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="24" font-weight="400">只有整段旅程都能完成转化，需求才会真正创造价值。</text><text x="1490" y="995" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>