<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#1a241a"/><text x="110" y="75" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" letter-spacing="3">实地案例 · 巴西–中国</text><line x1="110" y1="108" x2="470" y2="108" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="108" r="4" fill="#d4c39c"/><text x="110" y="174" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="52" font-weight="600">Connecting Cultures：巴西–中国的市场实践</text><text x="110" y="222" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">一个连接创作者、媒体、目的地与巴西旅游体验，并触达中国受众的市场激活案例。</text><line x1="110" y1="290" x2="1490" y2="290" stroke="#5f695d" opacity=".7"/><circle cx="285" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="285" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">12.2M</text><text x="285" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">创作者内容观看量</text><circle cx="800" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="800" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">3.1M</text><text x="800" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">媒体及记者内容观看量</text><circle cx="1315" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="1315" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="47" font-weight="600">15.351M</text><text x="1315" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">官方汇总观看量</text><circle cx="285" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="285" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">≈16M</text><text x="285" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">保守估算最终触达</text><circle cx="800" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="800" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">40+</text><text x="800" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">已发布内容</text><circle cx="1315" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="1315" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">4 + 3</text><text x="1315" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="600">创作者 + 记者</text><line x1="110" y1="700" x2="1490" y2="700" stroke="#5f695d" opacity=".7"/><text x="110" y="742" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8">叙事主题</text><rect x="110" y="770" width="250" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="235.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">自然与生物多样性</text><rect x="395" y="770" width="250" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="520.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">工程与科学</text><rect x="680" y="770" width="210" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="785.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">标志性里约</text><rect x="925" y="770" width="210" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1030.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">巴西文化</text><rect x="1170" y="770" width="320" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1330.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">日常生活与生活方式</text><text x="110" y="875" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="20" font-weight="500">以实地成果为证：内容、分发与体验作为一个完整系统协同运作。</text><text x="110" y="950" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400">来源：Connecting Cultures · 巴西–中国项目汇总报告，2025。</text><text x="1490" y="950" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>