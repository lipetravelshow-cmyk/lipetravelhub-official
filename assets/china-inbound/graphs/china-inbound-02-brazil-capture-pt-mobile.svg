<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
<rect width="1000" height="1250" fill="#1a241a"/>

<text x="70" y="72" fill="#d4c39c" font-family="DM Sans,Arial,sans-serif" font-size="23" letter-spacing="3">ESSENTIAL INTELLIGENCE · CHINA</text>
<line x1="70" y1="105" x2="410" y2="105" stroke="#d4c39c" stroke-width="2"/>
<circle cx="426" cy="105" r="4" fill="#d4c39c"/>

<text x="70" y="177" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="56" font-weight="600">
<tspan x="70">O Brasil começa a</tspan>
<tspan x="70" dy="64">capturar mais</tspan>
</text>

<text x="70" y="330" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="23">
<tspan x="70">As chegadas chinesas aceleram. Anos completos</tspan>
<tspan x="70" dy="34">e comparações YTD permanecem separados.</tspan>
</text>

<!-- FULL YEARS -->
<text x="70" y="430" fill="#d4c39c" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2">ANOS COMPLETOS</text>
<text x="70" y="473" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="31">Chegadas de chineses ao Brasil</text>

<rect x="75" y="548" width="360" height="118" rx="3" fill="#263126"/>
<text x="105" y="610" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="58" font-weight="600">76.5K</text>
<text x="105" y="646" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="600">2024</text>

<rect x="465" y="520" width="460" height="146" rx="3" fill="#31392d"/>
<text x="500" y="600" fill="#d4c39c" font-family="Playfair Display,Georgia,serif" font-size="66" font-weight="600">103,122</text>
<text x="500" y="642" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="20" font-weight="600">2025</text>

<line x1="70" y1="720" x2="930" y2="720" stroke="#5f695d"/>

<!-- YTD -->
<text x="70" y="772" fill="#d4c39c" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2">COMPARAÇÃO HOMÓLOGA · JAN–JUL</text>

<text x="75" y="865" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="55" font-weight="600">54,781</text>
<text x="75" y="902" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600">JAN–JUL 2025</text>

<text x="470" y="865" fill="#d4c39c" font-family="Playfair Display,Georgia,serif" font-size="62" font-weight="600">90,111</text>
<text x="470" y="902" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="19" font-weight="600">JAN–JUL 2026</text>

<circle cx="830" cy="855" r="82" fill="none" stroke="#d4c39c" stroke-width="2"/>
<text x="830" y="850" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,serif" font-size="39" font-weight="600">+64.5%</text>
<text x="830" y="883" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="600">A/A</text>

<!-- METHODOLOGY -->
<rect x="70" y="980" width="860" height="100" rx="3" fill="#263126"/>
<text x="95" y="1015" fill="#d4c39c" font-family="DM Sans,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="1.6">METODOLOGIA</text>
<text x="95" y="1050" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="17">
<tspan x="95">2026 é comparado apenas a jan–jul de 2025.</tspan>
<tspan x="95" dy="25">Não é exibido como um terceiro ano completo.</tspan>
</text>

<text x="70" y="1140" fill="#a8b0a1" font-family="DM Sans,Arial,sans-serif" font-size="16">Fonte: dados da Embratur para 2024, 2025 e jan–jul de 2026.</text>
<text x="930" y="1205" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,sans-serif" font-size="17" letter-spacing="2">LIPE TRAVEL HUB</text>
</svg>