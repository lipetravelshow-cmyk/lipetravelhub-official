<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><rect width="1600" height="1050" fill="#1a241a"/><text x="110" y="76" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="3">THE LIPE TRAVEL HUB FRAMEWORK</text><line x1="110" y1="110" x2="470" y2="110" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="110" r="4" fill="#d4c39c"/><text x="110" y="178" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="62" font-weight="600">The China-Ready Stack</text><text x="110" y="226" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400">From discovery to advocacy: five connected layers required to convert demand into durable inbound value.</text><path d="M170 520 C300 360 380 360 485 520 S680 680 800 520 S995 360 1115 520 S1325 680 1430 520" fill="none" stroke="#d4c39c" stroke-width="2" opacity=".45"/><circle cx="170" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="170" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="170" cy="520" r="7" fill="#d4c39c"/><text x="170" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">01</text><text x="170" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600" letter-spacing="1.0">DISCOVERABILITY</text><text x="170" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Can they find Brazil?</text><circle cx="485" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="485" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="485" cy="520" r="7" fill="#d4c39c"/><text x="485" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">02</text><text x="485" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600" letter-spacing="1.0">BOOKABILITY</text><text x="485" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Can they buy Brazil?</text><circle cx="800" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="800" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="800" cy="520" r="7" fill="#d4c39c"/><text x="800" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">03</text><text x="800" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600" letter-spacing="1.0">ACCESSIBILITY</text><text x="800" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Can they reach Brazil easily</text><text x="800" y="711" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">enough?</text><circle cx="1115" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="1115" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="1115" cy="520" r="7" fill="#d4c39c"/><text x="1115" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">04</text><text x="1115" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600" letter-spacing="1.0">RECEIVABILITY</text><text x="1115" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Does Brazil work once they</text><text x="1115" y="711" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">arrive?</text><circle cx="1430" cy="520" r="82" fill="none" stroke="#d4c39c" stroke-width="1.2" opacity=".55"/><circle cx="1430" cy="520" r="62" fill="#263126" stroke="#d4c39c" stroke-width="1" opacity=".95"/><circle cx="1430" cy="520" r="7" fill="#d4c39c"/><text x="1430" y="424" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="600" letter-spacing="1.8">05</text><text x="1430" y="650" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600" letter-spacing="1.0">ADVOCACY</text><text x="1430" y="687" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Will Brazil travel back to</text><text x="1430" y="711" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">China with them?</text><line x1="110" y1="860" x2="1490" y2="860" stroke="#5f695d"/><text x="110" y="910" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" letter-spacing="1.7">CORE PRINCIPLE</text><text x="300" y="910" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="25" font-weight="400">Demand is only valuable when the whole journey can convert it.</text><text x="1490" y="995" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>