<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><rect width="1600" height="1160" fill="#1a241a"/><text x="110" y="76" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="3">ESSENTIAL INTELLIGENCE · CHINA</text><line x1="110" y1="110" x2="470" y2="110" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="110" r="4" fill="#d4c39c"/><text x="110" y="176" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="60" font-weight="600">The Chinese Traveler Has Changed</text><text x="110" y="224" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">The opportunity is not only about more trips. It is about a different market composition: interests, autonomy, segmentation and technology.</text><circle cx="260" cy="300" r="44" fill="none" stroke="#f2eee4" opacity=".55"/><text x="260" y="310" fill="#f2eee4" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="26" font-weight="600">2017</text><circle cx="1340" cy="300" r="44" fill="none" stroke="#d4c39c" opacity=".9"/><text x="1340" y="310" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="26" font-weight="600">2026</text><line x1="310" y1="300" x2="1290" y2="300" stroke="#5f695d"/><path d="M310 300 C560 300 650 300 800 300 S1040 300 1290 300" fill="none" stroke="#d4c39c" stroke-width="2" opacity=".45"/><polygon points="1278,294 1292,300 1278,306" fill="#d4c39c" opacity=".75"/><line x1="170" y1="426" x2="1430" y2="426" stroke="#5f695d" opacity=".46"/><circle cx="800" cy="390" r="6" fill="#d4c39c"/><line x1="435" y1="390" x2="780" y2="390" stroke="#f2eee4" opacity=".20"/><line x1="820" y1="390" x2="1165" y2="390" stroke="#d4c39c" opacity=".48"/><text x="260" y="396" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">DESTINATION</text><text x="1340" y="396" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">INTEREST</text><line x1="170" y1="526" x2="1430" y2="526" stroke="#5f695d" opacity=".46"/><circle cx="800" cy="490" r="6" fill="#d4c39c"/><line x1="435" y1="490" x2="780" y2="490" stroke="#f2eee4" opacity=".20"/><line x1="820" y1="490" x2="1165" y2="490" stroke="#d4c39c" opacity=".48"/><text x="260" y="496" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">LARGE GROUPS</text><text x="1340" y="496" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">INDEPENDENT TRAVEL + SMALLER GROUPS</text><line x1="170" y1="626" x2="1430" y2="626" stroke="#5f695d" opacity=".46"/><circle cx="800" cy="590" r="6" fill="#d4c39c"/><line x1="435" y1="590" x2="780" y2="590" stroke="#f2eee4" opacity=".20"/><line x1="820" y1="590" x2="1165" y2="590" stroke="#d4c39c" opacity=".48"/><text x="260" y="596" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">STANDARDIZED PRODUCT</text><text x="1340" y="596" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">PERSONALIZED JOURNEYS</text><line x1="170" y1="726" x2="1430" y2="726" stroke="#5f695d" opacity=".46"/><circle cx="800" cy="690" r="6" fill="#d4c39c"/><line x1="435" y1="690" x2="780" y2="690" stroke="#f2eee4" opacity=".20"/><line x1="820" y1="690" x2="1165" y2="690" stroke="#d4c39c" opacity=".48"/><text x="260" y="696" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">DIGITAL BOOKING</text><text x="1340" y="696" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">INSPIRATION + COMPARISON + AI + BOOKING</text><line x1="170" y1="826" x2="1430" y2="826" stroke="#5f695d" opacity=".46"/><circle cx="800" cy="790" r="6" fill="#d4c39c"/><line x1="435" y1="790" x2="780" y2="790" stroke="#f2eee4" opacity=".20"/><line x1="820" y1="790" x2="1165" y2="790" stroke="#d4c39c" opacity=".48"/><text x="260" y="796" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">BROAD SEGMENTATION</text><text x="1340" y="796" fill="#d4c39c" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="600">GEN Z · FAMILIES · SILVER · PREMIUM · ADVENTURE · CULTURE</text><line x1="110" y1="855" x2="1490" y2="855" stroke="#5f695d" opacity=".7"/><text x="110" y="895" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8">INTERESTS GAINING GROUND</text><rect x="110" y="920" width="175" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="197.5" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">CULTURE</text><rect x="315" y="920" width="180" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="405.0" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">GASTRONOMY</text><rect x="525" y="920" width="240" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="645.0" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">NATURE &amp; OUTDOOR</text><rect x="795" y="920" width="185" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="887.5" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">SPORTS</text><rect x="1010" y="920" width="155" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1087.5" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">WELLNESS</text><rect x="1195" y="920" width="295" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1342.5" y="948" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">INDUSTRIAL TOURISM</text><rect x="110" y="990" width="1380" height="62" fill="#263126" opacity=".48" rx="2"/><text x="135" y="1030" fill="#f2eee4" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="500">Structural shift: less “Where should I go?” and more “What do I want to experience?”</text><text x="110" y="1120" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12.5" font-weight="400">Sources: ITB China; China Tourism Academy; World Tourism Alliance; Mastercard; Trip.com Group; Fliggy.</text><text x="1490" y="1120" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>