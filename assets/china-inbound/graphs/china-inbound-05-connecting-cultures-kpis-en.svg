<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#1a241a"/><text x="110" y="75" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" letter-spacing="3">FIELD CASE · BRAZIL–CHINA</text><line x1="110" y1="108" x2="470" y2="108" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="108" r="4" fill="#d4c39c"/><text x="110" y="174" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="58" font-weight="600">Connecting Cultures: Brazil–China in Practice</text><text x="110" y="222" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400">A market activation case connecting creators, media, destinations and Brazilian experiences with Chinese audiences.</text><line x1="110" y1="290" x2="1490" y2="290" stroke="#5f695d" opacity=".7"/><circle cx="285" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="285" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">12.2M</text><text x="285" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">creator views</text><circle cx="800" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="800" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">3.1M</text><text x="800" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">media + journalist views</text><circle cx="1315" cy="380" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="1315" y="400" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="47" font-weight="600">15.351M</text><text x="1315" y="442" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">officially consolidated views</text><circle cx="285" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="285" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">≈16M</text><text x="285" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">conservative final reach</text><circle cx="800" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="800" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">40+</text><text x="800" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">published pieces</text><circle cx="1315" cy="570" r="78" fill="none" stroke="#d4c39c" stroke-width="1" opacity=".18"/><text x="1315" y="590" fill="#d4c39c" text-anchor="middle" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="54" font-weight="600">4 + 3</text><text x="1315" y="632" fill="#a8b0a1" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="600">creators + journalists</text><line x1="110" y1="700" x2="1490" y2="700" stroke="#5f695d" opacity=".7"/><text x="110" y="742" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8">NARRATIVE TERRITORIES</text><rect x="110" y="770" width="250" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="235.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">NATURE &amp; BIODIVERSITY</text><rect x="395" y="770" width="250" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="520.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">ENGINEERING &amp; SCIENCE</text><rect x="680" y="770" width="210" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="785.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">ICONIC RIO</text><rect x="925" y="770" width="210" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1030.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">BRAZILIAN CULTURE</text><rect x="1170" y="770" width="320" height="44" fill="#263126" stroke="#5f695d" stroke-width="1" rx="2"/><text x="1330.0" y="798" fill="#f2eee4" text-anchor="middle" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600">EVERYDAY LIFE &amp; LIFESTYLE</text><text x="110" y="875" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="19" font-weight="500">Field proof, not promise: content, distribution and experience working as one system.</text><text x="110" y="950" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="13" font-weight="400">Source: consolidated Connecting Cultures · Brazil–China project reports, 2025.</text><text x="1490" y="950" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>