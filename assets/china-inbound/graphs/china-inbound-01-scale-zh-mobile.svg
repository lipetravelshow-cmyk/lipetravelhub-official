<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
<rect width="1000" height="1250" fill="#1a241a"/>

<text x="70" y="78" fill="#d4c39c" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="24" letter-spacing="3">核心旅游洞察 · 中国</text>
<line x1="70" y1="112" x2="410" y2="112" stroke="#d4c39c" stroke-width="2"/>
<circle cx="426" cy="112" r="4" fill="#d4c39c"/>

<text x="70" y="190" fill="#f2eee4" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="56" font-weight="600"><tspan x="70" dy="0">中国出境游的市场规模</tspan></text>
<text x="70" y="350" fill="#a8b0a1" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="23"><tspan x="70" dy="0">中国大陆居民出境旅游已经恢复到全球性规模。</tspan></text>

<text x="70" y="600" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="150" font-weight="600">148.36M</text>
<text x="76" y="660" fill="#d4c39c" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="600">出境人次 · 2025</text>
<text x="76" y="705" fill="#a8b0a1" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="23">同比 +20.8%</text>

<line x1="70" y1="785" x2="930" y2="785" stroke="#5f695d"/>

<text x="70" y="925" fill="#f2eee4" font-family="Playfair Display,Georgia,serif" font-size="102" font-weight="600">88.02M</text>
<text x="75" y="985" fill="#d4c39c" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600">2026年上半年</text>
<text x="75" y="1030" fill="#a8b0a1" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="22">同比 +10.5%</text>

<line x1="70" y1="1090" x2="930" y2="1090" stroke="#5f695d" opacity=".65"/>
<text x="70" y="1135" fill="#a8b0a1" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="15"><tspan x="70" dy="0">来源：中国文化和旅游部（2025）；ITB China / 国家移民管理局（2026年上半年）。</tspan></text>
<text x="930" y="1210" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,sans-serif" font-size="17" letter-spacing="2">LIPE TRAVEL HUB</text>
</svg>