<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#1a241a"/><text x="110" y="76" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" letter-spacing="3">ESSENTIAL INTELLIGENCE · CHINA</text><line x1="110" y1="110" x2="470" y2="110" stroke="#d4c39c" stroke-width="2"/><circle cx="486" cy="110" r="4" fill="#d4c39c"/><text x="110" y="180" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="64" font-weight="600">La escala del turismo outbound chino</text><text x="110" y="232" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">Los viajes internacionales de residentes de China continental volvieron a escala global.</text><g fill="none" stroke="#d4c39c" opacity=".22"><circle cx="1220" cy="430" r="245" stroke-width="1.4"/><circle cx="1220" cy="430" r="172"/><circle cx="1220" cy="430" r="95"/><line x1="925" y1="430" x2="1515" y2="430"/><line x1="1220" y1="135" x2="1220" y2="725"/><path d="M980 535 C1085 332 1270 290 1445 352" stroke-width="1.5"/></g><g fill="#d4c39c"><circle cx="1220" cy="430" r="8"/><circle cx="1445" cy="352" r="5"/></g><text x="110" y="475" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="185" font-weight="600">148.36M</text><text x="118" y="530" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" letter-spacing="1.3">VIAJES OUTBOUND · 2025</text><text x="118" y="570" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400">+20,8% interanual</text><line x1="110" y1="655" x2="700" y2="655" stroke="#5f695d"/><text x="110" y="728" fill="#f2eee4" text-anchor="start" font-family="Playfair Display,Georgia,Noto Serif CJK SC,serif" font-size="72" font-weight="600">88.02M</text><text x="410" y="708" fill="#d4c39c" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="600" letter-spacing="1.2">1.er SEMESTRE DE 2026</text><text x="410" y="745" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">+10,5% interanual</text><text x="110" y="845" fill="#a8b0a1" text-anchor="start" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400">Fuente: Ministerio de Cultura y Turismo de la RPC (2025); ITB China / National Immigration Administration (1S 2026).</text><text x="1490" y="845" fill="#d4c39c" text-anchor="end" font-family="DM Sans,Arial,Noto Sans CJK SC,sans-serif" font-size="14" font-weight="400" letter-spacing="2">LIPE TRAVEL HUB</text></svg>